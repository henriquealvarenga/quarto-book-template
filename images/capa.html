<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  /* Capa padrão da casa: 1600×2500 px. Renderizar com Chrome headless (ver code/make_cover.sh).
     Sem fotografia: fundo tipográfico na paleta do tema editorial. Para usar uma
     fotografia (licença compatível, crédito em creditos.qmd), veja o comentário em <body>. */
  @font-face{font-family:"Playfair Display";src:url("../fonts/PlayfairDisplay-Bold.woff2") format("woff2");font-weight:700;}
  @font-face{font-family:"Playfair Display";src:url("../fonts/PlayfairDisplay-Italic.woff2") format("woff2");font-weight:400;font-style:italic;}
  @font-face{font-family:"Inter";src:url("../fonts/Inter-Regular.woff2") format("woff2");font-weight:400;}
  @font-face{font-family:"Inter";src:url("../fonts/Inter-Medium.woff2") format("woff2");font-weight:500;}
  @font-face{font-family:"Inter";src:url("../fonts/Inter-SemiBold.woff2") format("woff2");font-weight:600;}
  html,body{margin:0;padding:0;width:1600px;height:2500px;overflow:hidden;background:#1a1a1a;}
  .cover{position:relative;width:1600px;height:2500px;overflow:hidden;font-family:"Inter",sans-serif;color:#fff;background:#1a1a1a;}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;}
  .grid{position:absolute;inset:0;background-image:
      linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size:100px 100px;}
  .glow{position:absolute;left:-300px;top:900px;width:1400px;height:1400px;border-radius:50%;
      background:radial-gradient(circle, rgba(180,83,9,.55) 0%, rgba(180,83,9,0) 62%);}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(26,26,26,0) 55%, rgba(26,26,26,.85) 100%);}
  .badge{position:absolute;top:70px;right:80px;width:150px;height:150px;border:3px solid rgba(255,255,255,.85);
      border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);}
  .badge svg{width:90px;height:90px;fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
  .colecao{position:absolute;top:96px;left:100px;font-size:30px;letter-spacing:.32em;text-transform:uppercase;
      color:rgba(255,255,255,.85);font-weight:500;}
  .text{position:absolute;left:100px;right:100px;bottom:270px;}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:210px;line-height:.95;margin:0 0 30px -6px;letter-spacing:-.01em;
      text-shadow:0 6px 30px rgba(0,0,0,.6);}
  h1 em{font-style:italic;font-weight:400;color:#b45309;}
  .sub{font-size:58px;font-weight:400;letter-spacing:.02em;color:rgba(255,255,255,.92);margin:0 0 34px;max-width:1300px;line-height:1.25;}
  .ed{display:inline-block;font-size:34px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
      padding:14px 28px;border:3px solid #fff;border-radius:6px;}
  .bar{position:absolute;left:0;right:0;bottom:0;height:160px;line-height:160px;background:#F9F9F7;text-align:center;
      font-size:44px;font-weight:500;letter-spacing:.1em;color:#1a1a1a;text-transform:uppercase;}
</style></head>
<body><div class="cover">
  <!-- Com fotografia: substitua .grid e .glow por  <img src="foto.jpg" alt="">  e mantenha .shade. -->
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="shade"></div>
  <div class="colecao">Temas em Psicopatologia</div>
  <div class="badge"><svg viewBox="0 0 100 100"><path d="M22 18h40l16 16v48H22z"/><path d="M62 18v16h16"/><path d="M34 46h32M34 58h32M34 70h20"/></svg></div>
  <div class="text">
    <h1>&lt;TODO: <em>Título</em>&gt;</h1>
    <p class="sub">Uma breve introdução</p>
    <span class="ed">1ª edição</span>
  </div>
  <div class="bar">Henrique Alvarenga</div>
</div></body></html>
