project:
  type: book
  output-dir: _book
  resources:
    - apple-touch-icon.png

lang: pt-BR
language: _language-pt.yml

book:
  # =========================================================================
  # METADADOS DO PROJETO — trocar em cada livro novo (marcados com <TODO>)
  # =========================================================================
  title: "<TODO: Título do livro>"
  subtitle: "Uma Breve Introdução"
  edition: "1ª edição"                        # metadado Pandoc — vai pro EPUB/citações

  # Autor padrão da casa (raramente muda)
  author:
    - name: "Henrique Alvarenga da Silva"
      orcid: 0000-0001-9799-5240
      email: henrique@ufsj.edu.br
      affiliations:
        - name: Universidade Federal de São João del-Rei (UFSJ)
          department: Curso de Medicina
  date: today
  date-format: "MMMM [de] YYYY"

  description: |
    <TODO: 2–4 linhas descrevendo o livro. Aparece em previews sociais
    e nos metadados do EPUB.>
  keyword: "<TODO: palavras-chave separadas por vírgula>"

  # Capa: images/capa.jpg (1600×2500 px, padrão da casa), gerada de images/capa.html
  # por code/make_cover.sh. Alternativa: editar images/capa.pxd no Pixelmator e
  # exportar como images/capa.jpg no mesmo tamanho.
  cover-image: images/capa.jpg
  favicon: images/favicon.png                 # 256×256, foto do autor (mesmo dos demais livros da casa); NÃO reaproveitar a capa
  # apple-touch-icon.png (raiz do projeto): PNG 180×180 sobre o off-white do tema (iOS não aceita SVG nem transparência).
  image: images/capa.jpg                      # thumbnail no sidebar e previews sociais

  # Repositório — trocar a URL em cada projeto. O GitHub Pages do usuário usa o
  # domínio próprio, logo o projeto é servido em henriquealvarenga.com/<repo>/
  # (não em github.io).
  site-url: "https://henriquealvarenga.com/<TODO-repo>"
  repo-url: https://github.com/henriquealvarenga/<TODO-repo>
  repo-branch: main
  search: true
  sharing: [twitter, facebook, linkedin]
  page-navigation: true
  back-to-top-navigation: true

  sidebar:
    style: docked
    collapse-level: 1
    border: true

  # =========================================================================
  # SUMÁRIO — estrutura-modelo. Renomear/expandir partes e capítulos.
  # Pastas padrão sempre presentes: capitulos/ apendices/ atividades/ casos/
  # =========================================================================
  chapters:
    - index.qmd
    - epigrafes.qmd          # contracapa de epígrafes — remover se não usar
    - apresentacao.qmd
    - part: "Parte I — <TODO: nome da parte>"
      chapters:
        - capitulos/parte-1-exemplo/01-introducao.qmd
    - part: "Parte II — Atividades"
      chapters:
        - casos/00-introducao.qmd
        - casos/caso-exemplo.qmd
        - atividades/atividade-exemplo.qmd
    - creditos.qmd
    - references.qmd

  appendices:
    - apendices/apendice-exemplo.qmd

  # Rodapé: identificação profissional (CFM) centralizada — igual em todos os livros.
  page-footer:
    center: |
      Dr. Henrique Alvarenga da Silva · Médico Psiquiatra · CRM-MG 31.778 · RQE 8381<br>
      [henriquealvarenga.com](https://henriquealvarenga.com)

# =========================================================================
# Bibliografia — ABNT autor-data, processada pelo Citeproc do Pandoc
# =========================================================================
bibliography: references/references.bib
csl: references/csl_styles/ABNT.csl
citeproc: true
link-citations: true
link-bibliography: true
# reference-section-title omitido de propósito: com ele, o Pandoc insere um
# subtítulo "Referências" vazio ao final de cada capítulo (a lista vive em
# references.qmd, que já tem o próprio título).

# =========================================================================
# Formatos de saída
# =========================================================================
format:
  html:
    theme:
      - cosmo
      - theme-editorial.scss
    css: styles.css
    fontsize: 1.05em
    linestretch: 1.65
    mainfont: "Inter"
    monofont: "JetBrains Mono"
    toc: true
    toc-depth: 3
    toc-title: "Nesta página"
    number-sections: true
    number-depth: 2
    code-fold: false
    code-tools: false
    smooth-scroll: true
    citations-hover: true
    crossrefs-hover: true
    footnotes-hover: true
    callout-appearance: simple
    fig-cap-location: bottom
    tbl-cap-location: top
    anchor-sections: true
    highlight-style: github
    link-external-newwindow: true
    include-in-header:
      text: '<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">'
    mermaid:
      theme: neutral

  # EPUB e PDF intencionalmente desabilitados no CI por padrão.
  # Para gerar localmente:  quarto render --to epub  ou  quarto render --to pdf
  # epub:
  #   cover-image: images/capa.jpg
  # pdf:
  #   documentclass: scrbook
  #   papersize: a5
  #   geometry:
  #     - inner=2.5cm
  #     - outer=2cm
  #     - top=2cm
  #     - bottom=2cm
  #   fontsize: 11pt
  #   colorlinks: true
  #   biblio-style: abnt
  #   cite-method: biblatex
  #   biblatexoptions: [style=abnt, backend=biber]

# =========================================================================
# Execução de código (os diagramas Mermaid não precisam de kernel)
# =========================================================================
execute:
  freeze: auto
  echo: false
  warning: false
  message: false
